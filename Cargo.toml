[package]
name = "hetzner-mcp"
version = "0.1.0"
edition = "2024"
# Floor set by rmcp 3.x and our use of let-chains.
rust-version = "1.88"
description = "MCP server for the Hetzner Cloud API (servers, images, volumes, networks, firewalls and more) over stdio"
license = "Apache-2.0"
repository = "https://github.com/thesimj/rust-hetzner-mcp"
readme = "README.md"
keywords = ["mcp", "hetzner", "hcloud", "cloud", "ai"]
categories = ["api-bindings", "command-line-utilities"]

[[bin]]
name = "hetzner-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "http2",
    "rustls",
    "gzip",
] }
anyhow = "1"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = "z"
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
