[package]
name = "hetzner-mcp"
version = "0.4.1"
authors = ["Nick Bubelich <n+github@bubelich.com>"]
edition = "2024"
# Floor set by rmcp 3.x and our use of let-chains.
rust-version = "1.88"
description = "MCP server for the Hetzner Cloud API (servers, images, volumes, networks, firewalls and more) over stdio"
license = "Apache-2.0"
repository = "https://github.com/thesimj/rust-hetzner-mcp"
homepage = "https://github.com/thesimj/rust-hetzner-mcp"
readme = "README.md"
keywords = ["mcp", "hetzner", "hcloud", "cloud", "ai"]
categories = ["api-bindings", "command-line-utilities"]
exclude = ["docs/"]

[[bin]]
name = "hetzner-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "http2",
    "rustls",
    "gzip",
] }
anyhow = "1"
# Already a transitive dep via reqwest; promoted to direct so hcloud.rs can
# parse the configured `endpoint` URL properly instead of hand-splitting
# (D2 finding 1). Caret, not pinned: reqwest already forces the major
# version via lockfile unification, so a patch release of the URL parser is
# safe to pick up.
url = "2"
# config.toml parsing only - no `display` (we never serialize TOML) and no
# `unbounded` (nesting stays depth-limited on untrusted-ish input).
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
wiremock = "0.6"
# In-process e2e test only (W2.4) - Cargo unifies features per crate version,
# so this never reaches the shipped binary (dev-dependencies aren't built
# for `cargo build --release`).
rmcp = { version = "3.1", features = ["client"] }

[profile.release]
opt-level = "z"
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
